<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロシア語単語帳</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f4f8;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 40px 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  margin-top: 20px;
}

.word {
  font-size: 36px;
  font-weight: bold;
}

.meaning {
  font-size: 20px;
  color: #666;
  margin-top: 15px;
  display: none;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 20px;
}

button {
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  color: white;
}

.btn-main { background: #4CAF50; }
.btn-next { background: #2196F3; }
.btn-audio { background: #9C27B0; }
.btn-fav { background: #FF9800; }

.mode-screen button {
  display: block;
  width: 100%;
  margin: 10px 0;
  background: #555;
}
</style>
</head>

<body>

<h2>ロシア語単語帳</h2>

<!-- モード選択 -->
<div id="modeScreen" class="mode-screen">
  <button onclick="start('random')">ランダム</button>
  <button onclick="start('noun')">名詞</button>
  <button onclick="start('verb')">動詞</button>
  <button onclick="start('adj')">形容詞</button>
  <button onclick="start('other')">その他</button>
  <button onclick="start('fav')">お気に入り</button>
</div>

<!-- 学習画面 -->
<div id="app" style="display:none;">
  <div class="card" onclick="showMeaning()">
    <div id="word" class="word"></div>
    <div id="meaning" class="meaning"></div>
  </div>

  <div class="buttons">
    <button class="btn-main" onclick="showMeaning()">答え</button>
    <button class="btn-next" onclick="nextWord()">次へ</button>
    <button class="btn-audio" onclick="speak()">🔊</button>
    <button class="btn-fav" onclick="toggleFavorite()">⭐</button>
  </div>
</div>

<script>
let data = [];
let current = null;
let mode = "random";
let fav = JSON.parse(localStorage.getItem("fav")) || [];

// JSON読み込み
fetch("./russian_words.json")
  .then(res => res.json())
  .then(json => {
    data = json;
  });

// モード開始
function start(selectedMode) {
  mode = selectedMode;
  document.getElementById("modeScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  nextWord();
}

// 出題
function nextWord() {
  let pool = data;

  if (mode === "noun") pool = data.filter(d => d.type === "noun");
  if (mode === "verb") pool = data.filter(d => d.type === "verb");
  if (mode === "adj") pool = data.filter(d => d.type === "adj");
  if (mode === "other") pool = data.filter(d => !["noun","verb","adj"].includes(d.type));
  if (mode === "fav") pool = data.filter(d => fav.includes(d.word));

  if (pool.length === 0) pool = data;

  current = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById("word").innerText = current.word;
  document.getElementById("meaning").style.display = "none";

  speak(); // ← 自動音声
}

// 答え
function showMeaning() {
  const el = document.getElementById("meaning");
  el.innerText = current.meaning;
  el.style.display = "block";
}

// 音声
function speak() {
  const u = new SpeechSynthesisUtterance(current.word);
  u.lang = "ru-RU";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// お気に入り
function toggleFavorite() {
  if (fav.includes(current.word)) {
    fav = fav.filter(f => f !== current.word);
  } else {
    fav.push(current.word);
  }
  localStorage.setItem("fav", JSON.stringify(fav));
}
</script>

</body>
</html>
