<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロシア語単語帳</title>
</head>

<body>

<h2>ロシア語単語帳</h2>

<div>
  <h1 id="word"></h1>
  <p id="meaning" style="display:none;"></p>
</div>

<button onclick="showMeaning()">答え</button>
<button onclick="nextWord()">次へ</button>
<button onclick="speak()">🔊</button>

<script>
let data = [];
let current = null;

// 👇 ここでJSON読み込み
fetch("russian_words.json")
  .then(res => res.json())
  .then(json => {
    data = json;
    nextWord();
  });

function nextWord() {
  current = data[Math.floor(Math.random() * data.length)];
  document.getElementById("word").innerText = current.word;
  document.getElementById("meaning").style.display = "none";
}

function showMeaning() {
  const el = document.getElementById("meaning");
  el.innerText = current.meaning;
  el.style.display = "block";
}

function speak() {
  const u = new SpeechSynthesisUtterance(current.word);
  u.lang = "ru-RU";
  speechSynthesis.speak(u);
}
</script>

</body>
</html>
